name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            os: ubuntu-24.04
            cmake_args: -DCMAKE_CXX_COMPILER=g++
          - name: Clang
            os: ubuntu-24.04
            cmake_args: -DCMAKE_CXX_COMPILER=clang++
          - name: GCC + ASan/UBSan
            os: ubuntu-24.04
            cmake_args: >-
              -DCMAKE_CXX_COMPILER=g++
              "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=all"
          - name: MSVC
            os: windows-latest
            cmake_args: ""

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Test
        run: ctest --test-dir build --build-config Debug --output-on-failure
